(() => {
 const viewport=document.querySelector('.viewport');
 const board=document.querySelector('.board');
 const dialog=document.querySelector('dialog');
 const enlarged=dialog.querySelector('iframe');
 const resize=new ResizeObserver(entries=>{
  const scale=entries[0].contentRect.width/2230;
  board.style.transform=`scale(${scale})`;
  viewport.style.height=`${2390*scale}px`;
 });
 resize.observe(viewport);
 document.querySelectorAll('.screen').forEach(button=>button.addEventListener('click',()=>{
  enlarged.srcdoc=button.querySelector('iframe').srcdoc;
  enlarged.title=button.getAttribute('aria-label');
  dialog.showModal();
  dialog.focus();
 }));
 dialog.addEventListener('click',event=>{
  if(event.target!==dialog)return;
  const rect=dialog.getBoundingClientRect();
  if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)dialog.close();
 });
})();
</script></body></html>
